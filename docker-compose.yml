version: '3.8'

services:
  # ============================================================================
  # MySQL 8.0 Data Warehouse Service
  # ============================================================================
  mysql-dwh:
    image: mysql:8.0
    container_name: ecommerce_mysql_dwh
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_dwh}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_dwh_data:/var/lib/mysql
      - ./sql/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce_network

  # ============================================================================
  # Airflow Standalone Development Service (Optional Containerized Runner)
  # ============================================================================
  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    container_name: ecommerce_airflow
    restart: unless-stopped
    depends_on:
      mysql-dwh:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
    ports:
      - "8080:8080"
    command: standalone
    networks:
      - ecommerce_network

volumes:
  mysql_dwh_data:
    driver: local

networks:
  ecommerce_network:
    driver: bridge
